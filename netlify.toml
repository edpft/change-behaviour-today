[build]
  # Tests/gates run in GitHub Actions (see .github/workflows/deploy.yml) before
  # merge; Netlify only needs to produce the deploy artifact.
  command = "npm run build"
  publish = "dst"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "script-src 'self' https://identity.netlify.com; object-src 'none'; base-uri 'none';"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "script-src 'self' https://identity.netlify.com https://unpkg.com; object-src 'none'; base-uri 'none';"
