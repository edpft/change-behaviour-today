name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'vitest.config.js'
      - 'eslint.config.js'
      - '.stylelintrc.json'
      - '.htmlvalidate.json'
      - '.lighthouserc.yml'
      - 'lychee.toml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/deploy.yml'
  # No path filter on PRs: the `test` job is a required status check, so it must
  # always run on every PR to main — a skipped required check blocks the merge.
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ['Process images']
    types: [completed]
    branches: [main]

jobs:
  test:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    # Run every step inside the flake devShell so CI matches local dev
    # (node, lychee, chromium and CHROME_PATH all come from flake.nix).
    defaults:
      run:
        shell: nix develop --command bash -e {0}

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: npm ci

      - name: Validate content
        run: npm test

      - name: Lint CSS
        run: npx stylelint 'src/**/*.scss'

      - name: Build
        run: npm run build

      - name: Verify build output
        run: npm run test:build

      - name: Validate HTML
        run: npm run validate:html

      - name: Test accessibility (axe)
        run: npm run test:a11y

      - name: Check links
        run: npm run validate:links

      - name: Lighthouse CI
        run: npm run lighthouse
