name: Process images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'

permissions:
  contents: write

jobs:
  process-images:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: nix develop --command bash -e {0}

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: npm ci

      - name: Process images
        run: node process-images.js images

      - name: Commit processed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/*.avif src/*.webp src/*.jpeg src/*.jpg
          git diff --staged --quiet || git commit -m "build: process images from /images [skip images]"
          git push
